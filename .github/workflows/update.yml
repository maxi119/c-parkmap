# 每週檢查停管處 PDF，更新資料並部署 GitHub Pages。
# 任何一步失敗都不會部署，線上網站維持上一版，GitHub 會寄出失敗通知信。
name: update

on:
  schedule:
    - cron: "0 1 * * 1"   # 每週一 09:00 台北時間（實際執行可能延遲）
  workflow_dispatch:
    inputs:
      force:
        description: "PDF 未變更也重建"
        type: boolean
        default: false
      refresh_osm:
        description: "重新下載 OSM 路網並重建"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - "overrides.csv"
      - "update_moto_parking.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: read

# 排程與手動同時觸發時依序執行，避免互相覆蓋 commit
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # commit status.json 與重建結果
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # 路網不 commit。用快取保留一份：Overpass 滿載時仍能重建，也減少對公共服務的請求
      - uses: actions/cache/restore@v6
        with:
          path: cache/osm_taipei_roads.json
          key: osm-${{ github.run_id }}
          restore-keys: osm-

      - name: 檢查更新
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          REFRESH_OSM: ${{ inputs.refresh_osm }}
        run: |
          args=()
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$REFRESH_OSM" = "true" ] && args+=(--refresh-osm)
          # 每月第一個週一更新路網，讓 OSM 的修正能反映到地圖
          if [ "$EVENT" = "schedule" ] && [ "$(TZ=Asia/Taipei date +%-d)" -le 7 ]; then
            args+=(--refresh-osm)
          fi
          python update_moto_parking.py "${args[@]}"

      - name: 保存路網快取
        if: hashFiles('cache/osm_taipei_roads.json') != ''
        uses: actions/cache/save@v6
        continue-on-error: true   # 內容相同時 key 已存在，不算失敗
        with:
          path: cache/osm_taipei_roads.json
          key: osm-${{ hashFiles('cache/osm_taipei_roads.json') }}

      # PDF 未變更時也會有 status.json 的差異：這個 commit 同時避免排程因 repo 久無活動被停用
      - name: 有差異才 commit
        run: |
          git add site data
          if git diff --cached --quiet; then
            echo "沒有差異"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新資料：$(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
