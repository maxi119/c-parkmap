# 階段 0：驗證 GitHub Actions 的 IP 能否連上 Overpass。驗證完即刪除。
name: probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: overpass-endpoints
        run: |
          python - <<'PY'
          import time
          from concurrent.futures import ThreadPoolExecutor
          import requests
          import update_moto_parking as u
          ENDPOINTS = (
              "https://overpass-api.de/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://overpass.private.coffee/api/interpreter",
              "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
          )
          def probe(url):
              started = time.time()
              try:
                  r = requests.post(url, data={"data": u.OVERPASS_QUERY}, headers=u.OVERPASS_HEADERS, timeout=290)
                  try:
                      detail = f"ways={len(r.json()['elements'])}"
                  except ValueError:
                      detail = "not-json: " + r.text[:120].replace("\n", " ")
                  return f"{url} HTTP {r.status_code} {len(r.content)} bytes {time.time() - started:.0f}s {detail}"
              except Exception as exc:
                  return f"{url} {type(exc).__name__} {time.time() - started:.0f}s"
          with ThreadPoolExecutor(4) as pool:
              for line in pool.map(probe, ENDPOINTS):
                  print(f"::notice title=overpass::{line}")
          PY
