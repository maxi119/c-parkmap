# 階段 0：用實際程式驗證 Actions 能否下載 Overpass，並建立第一份路網快取。驗證完即刪除。
name: probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: load-osm
        run: |
          python - <<'PY'
          import logging, time
          import update_moto_parking as u
          logging.basicConfig(level=logging.INFO)
          u.CACHE.mkdir(exist_ok=True)
          started = time.time()
          ways = u.load_osm(force=True)
          print(f"::notice title=overpass::ok ways={len(ways)} {time.time() - started:.0f}s")
          PY
      - uses: actions/cache/save@v6
        with:
          path: cache/osm_taipei_roads.json
          key: osm-${{ hashFiles('cache/osm_taipei_roads.json') }}
